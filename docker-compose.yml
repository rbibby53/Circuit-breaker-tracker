services:
  breakers:
    image: ghcr.io/rbibby53/circuit-breaker-tracker:latest
    # Or build it yourself from this repository:
    # build: .
    restart: unless-stopped
    # Port 2757 ("BRKR" on a phone keypad) is the default; change PORT below to move it.
    ports:
      - '2757:2757'
    # Or share the host's network instead of mapping ports (then only PORT matters):
    # network_mode: host
    environment:
      PORT: '2757'
      # The address people use to reach the app. Needed for invite links, QR codes and SSO.
      PUBLIC_URL: 'https://breakers.example.com'
      # Set when running behind a reverse proxy (Caddy, Nginx, Traefik…).
      TRUST_PROXY: 'true'
      # Optional: create the first admin automatically instead of using the setup screen.
      # ADMIN_USERNAME: "admin"
      # ADMIN_PASSWORD: "change-me-to-something-long"
      # Optional: Microsoft Entra ID single sign-on. See README.
      # OIDC_ISSUER: "https://login.microsoftonline.com/<tenant-id>/v2.0"
      # OIDC_CLIENT_ID: "<application-client-id>"
      # OIDC_CLIENT_SECRET: "<client-secret>"
      # OIDC_LABEL: "Sign in with Microsoft"
    volumes:
      - breakers-data:/data

volumes:
  breakers-data:
