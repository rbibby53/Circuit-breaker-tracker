version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # pnpm refuses packages published less than a day ago; give new releases time to settle.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch updates; majors arrive separately.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Move between Node majors by hand, to long-term-support releases only (even numbers).
      - dependency-name: node
        update-types: ['version-update:semver-major']
