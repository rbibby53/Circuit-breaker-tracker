name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: circuit-breaker-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and check it is healthy
        run: |
          docker run -d --name cbt -p 2757:2757 \
            -e ADMIN_USERNAME=ci -e ADMIN_PASSWORD=ci-password-only \
            circuit-breaker-tracker:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:2757/healthz; then exit 0; fi
            sleep 1
          done
          docker logs cbt
          exit 1
      - name: Start the image under BASE_PATH and check it
        run: |
          set -euo pipefail
          docker run -d --name cbt-prefix -p 2758:2757 -e BASE_PATH=/breakers circuit-breaker-tracker:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:2758/healthz > /dev/null; then break; fi
            sleep 1
          done
          fail() { echo "::error::$1"; docker logs cbt-prefix; exit 1; }
          # The image's own HEALTHCHECK command, run inside the container.
          docker exec cbt-prefix node -e "fetch('http://127.0.0.1:' + (process.env.PORT || 2757) + '/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" \
            || fail 'healthcheck failed under BASE_PATH'
          [ "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:2758/breakers)" = "301 http://localhost:2758/breakers/" ] \
            || fail '/breakers does not redirect to /breakers/'
          page=$(curl -sf http://localhost:2758/breakers/panels/1/field)
          echo "$page" | grep -q 'content="/breakers"' || fail 'page has no base path'
          asset=$(echo "$page" | grep -o 'src="/breakers/assets/[^"]*"' | head -1 | cut -d'"' -f2)
          [ -n "$asset" ] || fail 'page has no prefixed script'
          curl -sf -o /dev/null "http://localhost:2758$asset" || fail "$asset not served"
          curl -sf http://localhost:2758/breakers/api/auth/config > /dev/null || fail 'API not served under the prefix'
          docker logs cbt-prefix 2>&1 | grep -q 'listening at .*/breakers/' || fail 'base path not logged'
      - name: Print a PDF from the image
        run: |
          set -euo pipefail
          api=http://localhost:2757/api
          curl -sf -c jar -H 'x-cbt-csrf: 1' -H 'content-type: application/json' \
            -d '{"username":"ci","password":"ci-password-only"}' $api/auth/login > /dev/null
          id=$(curl -sf -b jar -H 'x-cbt-csrf: 1' -H 'content-type: application/json' \
            -d '{"parentId":null,"kind":"company","name":"CI"}' $api/locations | jq -r .id)
          curl -sf -b jar -o out.pdf "$api/locations/$id/pdf"
          head -c 5 out.pdf | grep -q '%PDF-' || { docker logs cbt; exit 1; }
