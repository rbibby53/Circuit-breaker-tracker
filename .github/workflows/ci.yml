name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: circuit-breaker-tracker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image and check it is healthy
        run: |
          docker run -d --name cbt -p 2757:2757 circuit-breaker-tracker:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:2757/healthz; then exit 0; fi
            sleep 1
          done
          docker logs cbt
          exit 1
