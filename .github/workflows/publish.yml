name: Publish image

# Pushes ghcr.io/<owner>/circuit-breaker-tracker:
#   every merge to main -> edge (the development build between releases)
#   a release           -> 1.2.3, 1.2, 1 and latest (called by the Release workflow)
on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version:
        description: The release version, e.g. 1.2.3. Built from its v1.2.3 tag.
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || '' }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version shown in the app: 1.2.3 for a release, 1.2.3-dev.<commit> for main.
      - id: version
        env:
          RELEASE: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE" ]; then
            v="$RELEASE"
          else
            v="$(node -p "require('./package.json').version")-dev.${GITHUB_SHA::7}"
          fi
          echo "app=$v" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/circuit-breaker-tracker
          # A pre-release (1.2.0-rc.1) gets only its own tag: never 1.2, 1 or latest.
          tags: |
            type=raw,value=edge,enable=${{ !inputs.version }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ !!inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ !!inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ !!inputs.version }}
            type=raw,value=latest,enable=${{ !!inputs.version && !contains(inputs.version, '-') }}
            type=sha
          flavor: |
            latest=false
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
